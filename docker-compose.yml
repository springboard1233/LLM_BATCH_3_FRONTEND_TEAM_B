version: '3.8'

services:
  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: fraud-dashboard-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fraud-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API Service (for standalone frontend setup)
  backend:
    build:
      context: ../LLM_BATCH_3_BACKEND_TEAM_B
      dockerfile: Dockerfile
    container_name: fraud-dashboard-backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://${MONGO_USER:-backend_user}:${MONGO_PASSWORD:-aBWmEIMJPz3yLIgq}@mongodb:27017/bfsidata?authSource=admin"
      MONGO_DB_NAME: bfsidata
      PREDICTION_COLLECTION: predictions
      TRANSACTION_COLLECTION: transactions
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AIzaSyDYBkMOcweet4lO54XfcM6GRPKDEUtq5Fk}
      MODEL_PATH: ./models/random_forest_model.pkl
      CORS_ORIGINS: "http://localhost:3000,http://frontend:80,http://fraud-dashboard-frontend:80"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../LLM_BATCH_3_BACKEND_TEAM_B/models:/app/models:ro
      - ../LLM_BATCH_3_BACKEND_TEAM_B/data:/app/data:ro
    networks:
      - fraud-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Service
  mongodb:
    image: mongo:7.0
    container_name: fraud-dashboard-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-backend_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-aBWmEIMJPz3yLIgq}
      MONGO_INITDB_DATABASE: bfsidata
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network
    restart: unless-stopped

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: fraud-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraud-network
    restart: unless-stopped

networks:
  fraud-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

